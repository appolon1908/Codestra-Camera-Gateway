        '409':
          description: Conflict (duplicate camera_ref or camera disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many concurrent camera operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Camera unreachable, auth failure, stream not found or invalid protocol response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Camera credential reference could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Camera timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}/snapshot:
    get:
      tags:
      - cameras
      summary: Snapshot
      description: Capture one frame over RTSP. Frames are never stored by the gateway.
      operationId: getCameraSnapshot
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: A single JPEG frame. X-Frame-* headers carry capture metadata.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            X-Frame-Timestamp:
              schema:
                type: string
                format: date-time
            X-Frame-Width:
              schema:
                type: integer
            X-Frame-Height:
              schema:
                type: integer
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (duplicate camera_ref or camera disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many concurrent camera operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Camera unreachable, auth failure, stream not found or invalid protocol response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Camera credential reference could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Camera timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}/preview.mjpeg:
    get:
      tags:
      - cameras
      summary: Preview
      description: 'LOCAL/OPERATOR USE ONLY. Disabled unless CAMERA_GATEWAY_ENABLE_MJPEG_PREVIEW=true.

        Bounded by session count, duration, frame rate and resolution. Not an integration

        surface for Middleware or other services.'
      operationId: previewCameraMjpeg
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Operator-only, time-limited, low-rate MJPEG preview (boundary=frame).
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled by configuration
          content:
            application/json:
