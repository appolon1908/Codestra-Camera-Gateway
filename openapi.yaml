      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnvifProbeResult'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled by configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (duplicate camera_ref or camera disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many concurrent camera operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Camera unreachable, auth failure, stream not found or invalid protocol response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Camera credential reference could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Camera timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}/stream-test:
    post:
      tags:
      - cameras
      summary: Stream Test
      description: Open the RTSP stream and report codec, profile, dimensions and frame rate.
      operationId: testCameraStream
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
