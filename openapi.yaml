openapi: 3.1.0
info:
  title: Codestra Camera Gateway API
  description: 'Standalone ONVIF/RTSP camera gateway. Owns camera connectivity only.


    Middleware V3 is the sole cross-system integration authority: callers reach this API only

    through Caddy -> Kong -> Middleware V3. Camera credentials are OpenBao secret references;

    plaintext passwords are never accepted, stored or returned.

    '
  version: 0.2.0
servers:
- url: http://localhost:8080
  description: Local development
paths:
  /healthz:
    get:
      tags:
      - operations
      summary: Healthz
      description: 'Liveness: the process is running. Does not contact cameras.'
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags:
      - operations
      summary: Readyz
      description: 'Readiness: registry, media tooling and secret backend are available.'
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /health/ready:
    get:
      tags:
      - operations
      summary: Readyz
      description: 'Readiness: registry, media tooling and secret backend are available.'
      operationId: healthReadyAlias
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /metrics:
    get:
      tags:
      - operations
      summary: Metrics
      description: Prometheus exposition. Private network only; never route through public ingress.
      operationId: metrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain; version=1.0.0; charset=utf-8: {}
  /v1/capabilities:
    get:
      tags:
      - operations
      summary: Capabilities
      operationId: capabilities
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /v1/onvif/discovery:
    post:
      tags:
      - onvif
      summary: Discover
      description: 'WS-Discovery multicast probe of the local segment. Development/operator use only;

        disabled by default and refused in production configuration.'
      operationId: discoverOnvifDevices
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResult'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled by configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /v1/cameras/status:
    get:
      tags:
      - cameras
      summary: Camera Status Summary
      description: Tenant-scoped summary of camera health as last observed by this service.
      operationId: serviceStatus
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSummary'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras:
    post:
      tags:
      - cameras
      summary: Create Camera
      description: 'Register a camera. Credentials are accepted only as OpenBao secret references;

        any plaintext password field is rejected with 422. camera_ref is unique per tenant,

        making retries safe (a duplicate returns 409 with no effect).'
      operationId: createCamera
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (duplicate camera_ref or camera disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - cameras
      summary: List Cameras
      operationId: listCameras
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraList'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}:
    get:
      tags:
      - cameras
      summary: Get Camera
      operationId: getCamera
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - cameras
      summary: Update Camera
      description: Partially update a camera. Changing host, rtsp, onvif or credentials resets health.
      operationId: updateCamera
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - cameras
      summary: Delete Camera
      operationId: deleteCamera
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
