openapi: 3.1.0
info:
  title: Codestra Camera Gateway API
  description: 'Standalone ONVIF/RTSP camera gateway. Owns camera connectivity only.


    Middleware V3 is the sole cross-system integration authority: callers reach this API only

    through Caddy -> Kong -> Middleware V3. Camera credentials are OpenBao secret references;

    plaintext passwords are never accepted, stored or returned.

    '
  version: 0.2.0
servers:
- url: http://localhost:8080
  description: Local development
paths:
  /healthz:
    get:
      tags:
      - operations
      summary: Healthz
      description: 'Liveness: the process is running. Does not contact cameras.'
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags:
      - operations
      summary: Readyz
      description: 'Readiness: registry, media tooling and secret backend are available.'
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /health/ready:
    get:
      tags:
      - operations
      summary: Readyz
      description: 'Readiness: registry, media tooling and secret backend are available.'
      operationId: healthReadyAlias
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /metrics:
    get:
      tags:
      - operations
      summary: Metrics
      description: Prometheus exposition. Private network only; never route through public ingress.
      operationId: metrics
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain; version=1.0.0; charset=utf-8: {}
  /v1/capabilities:
    get:
      tags:
      - operations
      summary: Capabilities
      operationId: capabilities
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /v1/onvif/discovery:
    post:
      tags:
      - onvif
      summary: Discover
      description: 'WS-Discovery multicast probe of the local segment. Development/operator use only;

        disabled by default and refused in production configuration.'
      operationId: discoverOnvifDevices
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResult'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled by configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /v1/cameras/status:
    get:
      tags:
      - cameras
      summary: Camera Status Summary
      description: Tenant-scoped summary of camera health as last observed by this service.
      operationId: serviceStatus
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusSummary'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras:
    post:
      tags:
      - cameras
      summary: Create Camera
      description: 'Register a camera. Credentials are accepted only as OpenBao secret references;

        any plaintext password field is rejected with 422. camera_ref is unique per tenant,

        making retries safe (a duplicate returns 409 with no effect).'
      operationId: createCamera
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (duplicate camera_ref or camera disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - cameras
      summary: List Cameras
      operationId: listCameras
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraList'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}:
    get:
      tags:
      - cameras
      summary: Get Camera
      operationId: getCamera
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - cameras
      summary: Update Camera
      description: Partially update a camera. Changing host, rtsp, onvif or credentials resets health.
      operationId: updateCamera
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - cameras
      summary: Delete Camera
      operationId: deleteCamera
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}/health:
    get:
      tags:
      - cameras
      summary: Camera Health
      description: 'Last observed health: status, last frame timestamp, dimensions and codec/profile.'
      operationId: getCameraHealth
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraHealth'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}/onvif/probe:
    post:
      tags:
      - cameras
      summary: Probe Onvif
      description: 'Query the camera over ONVIF for device information, media profiles and stream paths.

        Advertised addresses are reduced to paths on the registered host (no SSRF).'
      operationId: probeCameraOnvif
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnvifProbeResult'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled by configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (duplicate camera_ref or camera disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many concurrent camera operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Camera unreachable, auth failure, stream not found or invalid protocol response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Camera credential reference could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Camera timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}/stream-test:
    post:
      tags:
      - cameras
      summary: Stream Test
      description: Open the RTSP stream and report codec, profile, dimensions and frame rate.
      operationId: testCameraStream
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamTestResult'
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled by configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (duplicate camera_ref or camera disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many concurrent camera operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Camera unreachable, auth failure, stream not found or invalid protocol response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Camera credential reference could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Camera timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}/snapshot:
    get:
      tags:
      - cameras
      summary: Snapshot
      description: Capture one frame over RTSP. Frames are never stored by the gateway.
      operationId: getCameraSnapshot
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: A single JPEG frame. X-Frame-* headers carry capture metadata.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            X-Frame-Timestamp:
              schema:
                type: string
                format: date-time
            X-Frame-Width:
              schema:
                type: integer
            X-Frame-Height:
              schema:
                type: integer
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (duplicate camera_ref or camera disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many concurrent camera operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Camera unreachable, auth failure, stream not found or invalid protocol response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Camera credential reference could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Camera timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/cameras/{camera_id}/preview.mjpeg:
    get:
      tags:
      - cameras
      summary: Preview
      description: 'LOCAL/OPERATOR USE ONLY. Disabled unless CAMERA_GATEWAY_ENABLE_MJPEG_PREVIEW=true.

        Bounded by session count, duration, frame rate and resolution. Not an integration

        surface for Middleware or other services.'
      operationId: previewCameraMjpeg
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          description: Gateway camera ID
          title: Camera Id
        description: Gateway camera ID
      - name: X-Tenant-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
          title: X-Tenant-Id
        description: Tenant scope asserted by Middleware V3. Cross-tenant access returns 404.
      responses:
        '200':
          description: Operator-only, time-limited, low-rate MJPEG preview (boundary=frame).
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid service token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Feature disabled by configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Camera not found for this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (duplicate camera_ref or camera disabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many concurrent camera operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Camera unreachable, auth failure, stream not found or invalid protocol response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Camera credential reference could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Camera timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Camera:
      properties:
        id:
          type: string
          pattern: ^cam_[a-f0-9]{32}$
          title: Id
        tenant_id:
          type: string
          title: Tenant Id
        camera_ref:
          type: string
          title: Camera Ref
        name:
          type: string
          title: Name
        vendor:
          $ref: '#/components/schemas/Vendor'
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        host:
          type: string
          title: Host
        rtsp:
          $ref: '#/components/schemas/RtspSettings'
        onvif:
          $ref: '#/components/schemas/OnvifSettings'
        credentials:
          anyOf:
          - $ref: '#/components/schemas/CameraCredentials'
          - type: 'null'
        enabled:
          type: boolean
          title: Enabled
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        health:
          $ref: '#/components/schemas/CameraHealth'
        onvif_probe:
          anyOf:
          - $ref: '#/components/schemas/OnvifProbeResult'
          - type: 'null'
      type: object
      required:
      - id
      - tenant_id
      - camera_ref
      - name
      - vendor
      - model
      - host
      - rtsp
      - onvif
      - credentials
      - enabled
      - labels
      - created_at
      - updated_at
      - health
      title: Camera
    CameraCreate:
      properties:
        camera_ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
          title: Camera Ref
          description: Opaque tenant-scoped handle used by Middleware V3.
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        vendor:
          $ref: '#/components/schemas/Vendor'
          default: generic
        model:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Model
          examples:
          - H8c
        host:
          type: string
          maxLength: 253
          minLength: 1
          title: Host
        rtsp:
          $ref: '#/components/schemas/RtspSettings'
        onvif:
          $ref: '#/components/schemas/OnvifSettings'
        credentials:
          anyOf:
          - $ref: '#/components/schemas/CameraCredentials'
          - type: 'null'
        enabled:
          type: boolean
          title: Enabled
          default: true
        labels:
          patternProperties:
            ^[a-z0-9_.\-]{1,63}$:
              type: string
              maxLength: 128
          type: object
          maxProperties: 32
          title: Labels
      additionalProperties: false
      type: object
      required:
      - camera_ref
      - name
      - host
      title: CameraCreate
    CameraCredentials:
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9_.\-]{1,64}$
          title: Username
        password_ref:
          type: string
          maxLength: 1024
          pattern: ^openbao://[A-Za-z0-9][A-Za-z0-9_.-]{0,127}(?:/[A-Za-z0-9][A-Za-z0-9_.-]{0,127}){1,15}#[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$
          title: Password Ref
          description: 'OpenBao-compatible secret reference: openbao://<mount>/<path>#<key>. Plaintext
            secrets are rejected.'
          examples:
          - openbao://kv/cameras/lobby-h8c#password
      additionalProperties: false
      type: object
      required:
      - username
      - password_ref
      title: CameraCredentials
