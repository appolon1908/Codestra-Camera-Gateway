          type: string
          title: Name
        vendor:
          $ref: '#/components/schemas/Vendor'
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        host:
          type: string
          title: Host
        rtsp:
          $ref: '#/components/schemas/RtspSettings'
        onvif:
          $ref: '#/components/schemas/OnvifSettings'
        credentials:
          anyOf:
          - $ref: '#/components/schemas/CameraCredentials'
          - type: 'null'
        enabled:
          type: boolean
          title: Enabled
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        health:
          $ref: '#/components/schemas/CameraHealth'
        onvif_probe:
          anyOf:
          - $ref: '#/components/schemas/OnvifProbeResult'
          - type: 'null'
      type: object
      required:
      - id
      - tenant_id
      - camera_ref
      - name
      - vendor
      - model
      - host
      - rtsp
      - onvif
      - credentials
      - enabled
      - labels
      - created_at
      - updated_at
      - health
      title: Camera
    CameraCreate:
      properties:
        camera_ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
          title: Camera Ref
          description: Opaque tenant-scoped handle used by Middleware V3.
        name:
          type: string
          maxLength: 128
          minLength: 1
          title: Name
        vendor:
          $ref: '#/components/schemas/Vendor'
          default: generic
        model:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Model
          examples:
          - H8c
        host:
          type: string
          maxLength: 253
          minLength: 1
          title: Host
        rtsp:
          $ref: '#/components/schemas/RtspSettings'
        onvif:
          $ref: '#/components/schemas/OnvifSettings'
        credentials:
          anyOf:
          - $ref: '#/components/schemas/CameraCredentials'
          - type: 'null'
        enabled:
          type: boolean
          title: Enabled
          default: true
        labels:
          patternProperties:
            ^[a-z0-9_.\-]{1,63}$:
              type: string
              maxLength: 128
          type: object
          maxProperties: 32
          title: Labels
      additionalProperties: false
      type: object
      required:
      - camera_ref
      - name
      - host
      title: CameraCreate
