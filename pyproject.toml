[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codestra-camera-gateway"
version = "0.2.0"
description = "Standalone ONVIF/RTSP camera gateway. Cross-system integration is mediated by Middleware V3."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["camera_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: requires ffmpeg/ffprobe binaries on PATH"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S603", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S104"]

[project.scripts]
camera-gateway = "camera_gateway.app:main"
